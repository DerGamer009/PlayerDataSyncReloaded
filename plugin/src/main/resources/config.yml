# Global Settings
debug: false

# Auto-Save Settings (Safe guard against crashes)
autosave:
  enabled: true
  interval: 300 # In seconds (5 minutes)

# Exclusion Settings
exclusions:
  # Worlds where players will NOT have their data saved/loaded
  worlds:
    - "no_sync_world"
  # Items that will NOT be synced (by Material name)
  items:
    - "BARRIER"
    - "BEDROCK"

# Storage Settings
storage:
  type: "mysql" # mysql, mariadb, postgres, mongodb
  host: "localhost"
  port: 3306
  database: "minecraft"
  username: "root"
  password: ""
  # Connection URL for MongoDB Cloud (Atlas) or advanced setups
  connection_url: "mongodb+srv://user:pass@host/database"

# Migration Settings (Used only for /pds migrate command)
# This is the TARGET storage where data will be moved TO.
migration:
  legacy: false # Set to true if migrating from the OLD PlayerDataSync version
  type: "mongodb"
  host: "localhost"
  port: 27017
  database: "minecraft_new"
  username: "root"
  password: ""
  connection_url: ""

# Redis Settings (Highly recommended for cross-server syncing)
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  ssl: false

# Security Settings (Safe from decoding)
security:
  # 16+ characters for AES encryption. Leave empty to disable.
  encryption_key: ""

# Sync Settings (true = sync, false = don't sync)
sync:
  inventory: true
  ender_chest: true
  health: true
  food: true
  experience: true
  potion_effects: true
  advancements: true
  statistics: true
  game_mode: true
  flight: true
  location: false # Teleports the player to their stored position on join. Off by default: the target server must have a world of the same name.
  attributes: true
  pdc: true # Persistent Data Container
  economy: true # Vault Economy
  force_save_on_quit: false
  min_save_interval_ms: 0 # 0 = disabled, helpful to reduce autosave spam
  enforce_cooldown_on_quit: false # true = cooldown also applies to normal quit saves
  air_level: true
  fire_ticks: true
  player_time: true
  player_weather: true
  freeze_ticks: true
  arrows_in_body: true
  absorption: true
  speeds: true
  fall_distance: true

# Message Settings
messages:
  prefix: "&8[&bSync&8] &r"
  sync_started: "&7Syncing your data..."
  sync_complete: "&aData synced successfully!"
  sync_failed: "&cFailed to sync your data. Please contact an admin."

# Discord Webhook Settings
discord:
  enabled: false
  webhook_url: ""
  username: "PlayerDataSync"
  avatar_url: ""
  # Filter which events to send to Discord
  events:
    sync_success: true
    sync_failed: true
    errors: true
    backups: true

