# PlayerDataSync configuration (Fabric / Forge)
# Key names match the Bukkit config.yml paths.

# Name of this server, stored with every save and shown by /pds info.
# Empty = "port <server port>".
server_name=

# --- Storage ---
# type: mariadb | postgres | mysql | mongodb
#
# SQLite is NOT supported: any unknown value falls back to the MySQL driver.
# On Fabric/Forge only mariadb, postgres and mongodb work out of the box --
# the MySQL driver is not bundled and, unlike Paper/Spigot, the loader does not
# provide one. The MariaDB driver also connects to MySQL servers.
storage.type=mariadb
storage.host=localhost
storage.port=3306
storage.database=minecraft
storage.username=root
storage.password=

# --- What to synchronize ---
sync.inventory=true
sync.ender_chest=true
sync.health=true
sync.food=true
sync.experience=true
sync.potion_effects=true
sync.advancements=true
sync.statistics=true
sync.game_mode=true
sync.flight=true
sync.attributes=true
sync.pdc=true
sync.economy=true

# Teleports the player to their stored position on join.
# Off by default: the target server must have a world of the same name.
sync.location=false

sync.air_level=true
sync.fire_ticks=true
sync.player_time=true
sync.player_weather=true
sync.freeze_ticks=true
sync.arrows_in_body=true
sync.absorption=true
sync.speeds=true
sync.fall_distance=true

# --- Save behaviour ---
sync.force_save_on_quit=false
# 0 = disabled. Helps reduce autosave spam.
sync.min_save_interval_ms=0
sync.enforce_cooldown_on_quit=false
# Look for a newer record once more after a join (covers switches the proxy did not wait for). 0 = off.
sync.recheck_after_join_ms=3000

# --- Exclusions (comma-separated) ---
exclusions.worlds=
exclusions.items=

# --- Messages ---
messages.sync_started=&7Syncing your data...
messages.sync_complete=&aData synced successfully!
messages.sync_failed=&cFailed to sync your data. Please contact an admin.
