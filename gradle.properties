group=de.playerdatasync
version=26.7-Release

# Which Fabric/Forge adapter line is embedded in :plugin:shadowJar (must match settings.gradle.kts versionModules).
pds.fabric.bundle=v26_1_R1
pds.forge.bundle=v1_20_R1

# Performance Optimizations
# Configuration cache off: ForgeGradle, Fabric Loom, and several modding tasks are not CC-safe yet
# (reobfJarJar, Loom remapJar/MixinVersion, custom Velocity codegen).
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true

# ForgeGradle (extractSrg / MCP) is heap-heavy; building multiple :forge-versions:* at once needs a larger daemon.
# Lower -Xmx here if your machine has little RAM, or run one forge module at a time (e.g. only :forge-versions:v1_20_R1:...).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Loom source-remap step (IDE-comfort) fails on cross-mapping (yarn 1.21.11 -> MC 26.x). This flag disables it — same knob CI runs use.
systemProp.fabric.loom.ci=true

# Reposilite credentials belong in ~/.gradle/gradle.properties or the
# PDS_REPOSILITE_USERNAME / PDS_REPOSILITE_PASSWORD environment variables.
